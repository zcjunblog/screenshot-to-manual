<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流程演示台 — 虚构测试</title><style>
*{box-sizing:border-box}body{margin:0;color:#172b4d;background:#f2f6fc;font:16px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}header{background:#173e75;color:#fff;padding:24px 36px;display:flex;justify-content:space-between}header small{color:#b9d0f3}aside{position:absolute;top:95px;bottom:0;width:210px;background:#fff;padding:34px 24px;color:#56708f}aside b{display:block;background:#ebf2fd;color:#2365b9;padding:14px;border-radius:8px}main{margin-left:210px;padding:35px 42px;max-width:1200px}h1{font-size:26px;margin:4px 0 10px}p{color:#61718b;line-height:1.7}section{background:#fff;border:1px solid #dce5f2;border-radius:16px;padding:28px;margin-top:24px}.bar{display:flex;justify-content:space-between;align-items:center}button{background:#2463b9;border:0;color:white;padding:13px 24px;font:inherit;border-radius:8px;cursor:pointer}table{border-collapse:collapse;width:100%;margin-top:24px}td,th{text-align:left;padding:18px 12px;border-bottom:1px solid #e8edf5}th{background:#f5f8fc;color:#58708e;font-size:14px}label{display:block;font-weight:600;margin:22px 0 10px}input,select{display:block;width:100%;padding:13px;border:1px solid #ccd9eb;border-radius:8px;font:inherit;background:#fff}.form{max-width:560px}.tag{color:#2463b9;background:#eaf2ff;border-radius:5px;padding:6px 10px}.success{padding:15px;background:#eaf7f1;color:#216c4c;margin-bottom:20px;border-radius:8px}.demo{font-size:12px;letter-spacing:1px;color:#8795aa;margin-top:24px}@media(max-width:600px){header{padding:20px}header small{display:none}aside{display:none}main{margin:0;padding:25px 20px}section{padding:18px}h1{font-size:24px}.bar{gap:10px}button{padding:11px 16px;white-space:nowrap}td,th{font-size:13px;padding:14px 5px}}
</style><header><b>流程演示台</b><small>内部培训环境 · 不连接真实业务</small></header><aside><b>申请管理</b><p>记录查询</p><p>使用帮助</p></aside><main id="app"></main><script>
let state='list';const app=document.querySelector('#app');function draw(){app.innerHTML=`<h1>办公用品申请</h1><p>演示目标：填写申请信息并查看提交后的列表。</p>`+(state==='form'?`<section class="form"><h2>新建申请</h2><form id="form"><label for="item">物品名称</label><input id="item" value=""><label for="amount">申请数量</label><input id="amount" type="number" value="1" min="1"><label for="owner">申请人</label><input id="owner" value="演示员工"><p>请核对信息后提交。</p><button id="submit">提交申请</button></form></section>`:`<section>${state==='done'?'<div class="success">提交成功，申请已加入演示列表。</div>':''}<div class="bar"><b>申请列表</b><button id="new">新建申请</button></div><table><thead><tr><th>物品</th><th>数量</th><th>状态</th></tr></thead><tbody>${state==='done'?'<tr><td>演示笔记本</td><td>2</td><td><span class="tag">待处理</span></td></tr>':'<tr><td colspan="3">暂无申请，点击右上方按钮开始。</td></tr>'}</tbody></table></section>`)+`<p class="demo">虚构演示程序 · 仅用于Skill测试，不是任何真实产品界面</p>`;if(state==='form')document.querySelector('form').onsubmit=e=>{e.preventDefault();state='done';draw()};else document.querySelector('#new').onclick=()=>{state='form';draw()}}
draw();</script></html>
